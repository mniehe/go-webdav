version: "2"
linters:
  enable:
    - gocritic
    - gosec
    - misspell
    - prealloc
  settings:
    errcheck:
      disable-default-exclusions: true
      check-type-assertions: true
      check-blank: true
    gocritic:
      enable-all: true
    gosec:
      includes:
        - G101
        - G102
        - G103
        - G104
        - G106
        - G107
        - G108
        - G109
        - G110
        - G111
        - G112
        - G113
        - G114
        - G115
        - G201
        - G202
        - G203
        - G204
        - G301
        - G302
        - G303
        - G304
        - G305
        - G306
        - G307
        - G401
        - G402
        - G403
        - G404
        - G405
        - G406
        - G501
        - G502
        - G503
        - G504
        - G505
        - G506
        - G507
        - G601
        - G602
    govet:
      enable-all: true
      disable:
        - fieldalignment # Readability is more important than minor memory optimizations
    misspell:
      mode: restricted
      locale: UK
      # `calendar-color` is Apple's property name on the wire; the UK locale must
      # not push comments about it to "colour".
      ignore-rules:
        - color
    prealloc:
      simple: true
      range-loops: true
      for-loops: true
    staticcheck:
      checks:
        - all
    unused:
      field-writes-are-uses: true
      post-statements-are-reads: false
      exported-fields-are-used: true
      parameters-are-used: true
      local-variables-are-used: true
      generated-is-used: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
